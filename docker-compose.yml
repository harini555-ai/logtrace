version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: logtrace-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-logtrace}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-update}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
        VITE_WS_BASE_URL: http://localhost:8080/ws-logtrace
    container_name: logtrace-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
