spring.application.name=logtrace-backend
server.port=${PORT:8080}

# Database Configuration (Injected via Environment Variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:defaultdb}?sslmode=require&useSSL=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Serialization & Logging
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
logging.level.root=INFO
logging.level.com.logtrace=INFO